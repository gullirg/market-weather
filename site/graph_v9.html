<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Market Weather Report</title>
<style>
:root{
  --bg:#060809; --ink:#E8EAED; --dim:#8B939A; --faint:#3A4046;
  --line:#171C20; --mono:'JetBrains Mono',ui-monospace,monospace;
  --calm:#5B6478; --up:#37C98B; --down:#5B8DEF; --hot:#E05555;
  --glut:#E08B3C; --fear:#C86BD8; --warn:#E0C23C}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);
  font:14px/1.55 Inter,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;
  max-width:1060px;margin:0 auto;padding:22px 26px 10px}
.hdr{display:flex;justify-content:space-between;align-items:baseline}
.wordmark{font-weight:650;letter-spacing:.01em}
.wordmark span{color:var(--dim);font-weight:400}
.issued{font-family:var(--mono);font-size:12px;color:var(--dim)}
.syn{margin:20px 0 2px;font-size:22px;font-weight:550;letter-spacing:-.01em}
.subsyn{color:var(--dim);font-size:13px}
.streak{margin:10px 0 0;display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;color:var(--dim);
  text-decoration:none}
.streak i{width:6px;height:6px;border-radius:2px;display:inline-block;
  margin-right:3px}
.streak .note{color:var(--faint)}
.tabs{display:flex;gap:4px;margin:16px 0 10px;
  border-bottom:1px solid var(--line)}
.tab{font:600 12px/1 Inter;letter-spacing:.12em;color:var(--dim);
  padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.alerts{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 6px;
  font:600 12px Inter;letter-spacing:.04em}
.alerts .lamp2{display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:14px;padding:5px 12px;
  color:var(--dim)}
.alerts .lamp2 i{width:8px;height:8px;border-radius:50%;
  box-shadow:0 0 8px currentColor}
.changed{font-size:13px;color:var(--dim);margin:0 0 10px}
.hero{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  margin:6px 0 12px}
.hero .cond{font-size:22px;font-weight:600}
.hero .temp{font-family:var(--mono);font-size:44px;font-weight:500;
  letter-spacing:-.02em}
.hero .temp small{font-size:18px;color:var(--dim)}
.hero .hl{font-family:var(--mono);font-size:13px;color:var(--dim)}
.hero .hl b{color:var(--ink);font-weight:500}
.scale{position:relative;height:6px;border-radius:3px;
  margin:8px 0 3px;background:linear-gradient(90deg,#5B6478,#8a8253,
  #E08B3C,#E05555)}
.scale.flat{background:var(--line)}
.scale .mk{position:absolute;top:-3px;width:12px;height:12px;
  border-radius:50%;background:#fff;border:2px solid #0b0e14;
  transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.5)}
.scale .tick{position:absolute;top:-2px;width:2px;height:10px;
  background:var(--dim);opacity:.7;transform:translateX(-50%)}
.zl{display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.06em;margin-bottom:2px}
.tickcap{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;
  margin:6px 0 0}
.spark i{flex:1;border-radius:1px;min-height:2px;opacity:.85}
.rbar{position:relative;height:6px;border-radius:3px;
  background:var(--line);margin:6px 0 2px}
.rbar .rng{position:absolute;top:0;height:6px;border-radius:3px}
.rbar .mid{position:absolute;top:-2px;width:2px;height:10px;
  background:#fff;transform:translateX(-50%)}
.cbar{height:3px;border-radius:2px;background:var(--line);
  margin-top:5px;position:relative}
.cbar i{position:absolute;left:0;top:0;height:3px;border-radius:2px}
.dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  gap:8px;margin:4px 0 14px}
.dial{border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  background:rgba(13,16,22,.5)}
.dial .n{font:600 10.5px Inter;letter-spacing:.12em;color:var(--faint)}
.dial .v{font-family:var(--mono);font-size:18px;margin:3px 0 1px}
.dial .v .ar{font-size:12px;margin-left:4px}
.dial .d{font-size:10.5px;color:var(--dim);line-height:1.35}
.fcstrip{display:flex;gap:8px;margin:0 0 4px;flex-wrap:wrap}
.fccard{flex:1;min-width:120px;border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;background:rgba(13,16,22,.5)}
.fccard .mo3{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.fccard .w{font:600 13px Inter;margin:3px 0 1px}
.fccard .t{font-family:var(--mono);font-size:12px;color:var(--dim)}
.fccard .r{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:8px;margin:2px 0 14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  background:rgba(13,16,22,.5)}
.tile .n{font:600 10.5px Inter;letter-spacing:.1em;color:var(--dim)}
.tile .s{font:600 14px Inter;margin:3px 0 1px}
.tile .p{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.k2{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.12em;margin:10px 0 6px}
.istrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none}
.istrip::-webkit-scrollbar{display:none}
.itile{flex:none;width:92px;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;background:rgba(13,16,22,.4)}
.itile .n{font:600 10.5px Inter;letter-spacing:.06em;color:var(--dim)}
.itile .s{font:600 12px Inter;margin:2px 0 0}
.itile .p{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.fc{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.fcrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;background:rgba(13,16,22,.4)}
.fcrow .n{font:600 10.5px Inter;letter-spacing:.1em;color:var(--dim);
  width:92px;flex:none}
.fcrow .m{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.fcchip{display:flex;flex-direction:column;align-items:center;
  border-radius:9px;padding:5px 9px;min-width:74px;
  border:1px solid var(--line)}
.fcchip .mo2{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.fcchip .w{font:600 12px Inter}
.fcchip .pr{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.fcnote{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  margin:2px 0 10px}
.pins{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.pin{font:600 10.5px/1 Inter;letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line);border-radius:14px;padding:5px 11px;
  cursor:pointer;background:none}
.pin.on{color:var(--ink);border-color:#3A4652;background:#0D1116}
.scrubrow{display:flex;align-items:center;gap:12px;margin:4px 0 0}
#scrub{flex:1;-webkit-appearance:none;height:2px;
  background:var(--line);border-radius:2px;outline:none}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;
  width:13px;height:13px;border-radius:50%;background:var(--ink);
  cursor:pointer}
.mo{font-family:var(--mono);font-size:12px;color:var(--dim);
  min-width:120px;text-align:right}
.evt{font-family:var(--mono);font-size:12px;color:var(--faint);
  height:15px;margin-top:2px}
#graphbox{position:relative;flex:1;min-height:430px}
#g{width:100%;height:auto;display:block}
#card{position:absolute;width:250px;background:rgba(13,16,22,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid #1E2530;border-radius:12px;padding:14px 16px;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;
  font-size:13px}
#card.on{opacity:1;pointer-events:auto}
#card h3{font-size:12px;letter-spacing:.1em;font-weight:650}
#card .st{font-weight:600;font-size:13px;margin:2px 0 1px}
#card .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#card .k{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.08em;margin:9px 0 3px;text-transform:uppercase}
#card .row{display:flex;align-items:baseline;gap:6px;margin:2px 0}
#card .row i{width:7px;height:7px;border-radius:50%;flex:none;
  box-shadow:0 0 6px currentColor}
#card .row .sh{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
#card .row .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
#card .x{position:absolute;top:8px;right:12px;color:var(--faint);
  cursor:pointer;font-size:14px}
#card .mut{color:var(--faint);font-size:12px;margin-top:8px}
.ticker{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 0;
  font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ticker b{color:var(--ink);font-weight:500}
.ftr{display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin:10px 0 4px;
  font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.ftr a{color:var(--dim);text-decoration:none;
  border-bottom:1px solid var(--line)}
.lights i{width:7px;height:7px;border-radius:50%;display:inline-block;
  margin-left:4px}
</style></head><body>
<div class=hdr>
  <div class=wordmark>THE MARKET WEATHER <span>REPORT</span></div>
  <div class=issued id=issued></div>
</div>
<div class=syn id=syn></div>
<div class=subsyn id=subsyn></div>
<a class=streak id=streak href="report.html#scorecard-streak"
   style="display:none"></a>
<div class=tabs>
  <div class=tab id=tab-today data-t=today>TODAY</div>
  <div class=tab id=tab-map data-t=map>MAP</div>
  <a class=tab href="report.html" style="text-decoration:none">RECORD</a>
</div>
<div id=pane-today>
  <div class=hero id=hero></div>
  <div class=alerts id=alerts></div>
  <div class=dials id=dials></div>
  <div class=k2 id=fchead>NEXT MONTHS</div>
  <div class=fcstrip id=fcstrip></div>
  <div class=changed id=changed></div>
  <div class=k2>BLOCKS <span id=showall style="cursor:pointer;
    color:var(--dim);letter-spacing:.06em">&middot; show all
    instruments</span></div>
  <div class=tiles id=tiles></div>
  <div class=istrip id=blockdetail style="display:none;margin-top:2px">
  </div>
</div>
<div id=pane-map>
<div class=pins id=pins></div>
<div class=scrubrow>
  <input id=scrub type=range min=0 max=1 value=0 step=1>
  <div class=mo id=scrubmo></div>
</div>
<div class=evt id=evt></div>
<div id=graphbox>
  <canvas id=g width=1960 height=1050></canvas>
  <div id=card></div>
</div>
</div>
<div class=ticker id=ticker></div>
<div class=ftr>
  <div id=honesty>block spillovers re-estimated per window; edges at
    3%+; each card states what its window is computed from</div>
  <div class=lights id=lights></div>
  <div><a href="report.html">the record</a></div>
</div>
<script>
const DATA = __DATA__;
function getCss(v){return getComputedStyle(document.documentElement)
  .getPropertyValue(v).trim()||'#5B6478';}
const FAMCOL=[getCss('--calm'),getCss('--down'),getCss('--up'),
  getCss('--warn'),getCss('--hot')];
const FAMWORD={0:'calm',1:'easing',2:'up',3:'strained',4:'hot'};
const V3=DATA.v3||{}, FR=(V3.block_frames&&V3.block_frames.frames)||[];
const MB=(V3.block_frames&&V3.block_frames.blocks)||[];
const MEM=V3.members||{}, JOINED=V3.joined||{}, FAM=V3.fam_strip||{};
const M=DATA.months||[];
const W=980,H=525,DPR=2;
const P={energy:[490,86],liquidity:[886,62],rates_expectations:[812,208],
  credit:[758,398],equities:[490,474],fx:[222,398],metals:[168,208],
  activity:[94,62]};
const LBL={energy:'top',liquidity:'right',rates_expectations:'right',
  credit:'right',equities:'bottom',fx:'left',metals:'left',
  activity:'left'};
const NAME={energy:'ENERGY',rates_expectations:'RATES',credit:'CREDIT',
  fx:'FX',equities:'EQUITIES',metals:'METALS',activity:'ACTIVITY',
  liquidity:'LIQUIDITY'};
const REDUCED=(typeof matchMedia!=='undefined')&&
  matchMedia('(prefers-reduced-motion: reduce)').matches;
let fi=Math.max(0,FR.length-1), sel=null, livePaths=null;
const LIVEI=FR.length-1;
function monthIdx(l){return M.indexOf(l);}
function nodeFam(n,mi){return (FAM[n]&&FAM[n][mi]!==undefined)?FAM[n][mi]:-1;}
function blockFam(b,mi){let best=-1;
  for(const m of (MEM[b]||[])){const f=nodeFam(m,mi);if(f>best)best=f;}
  return best;}
function blockConf(b){let best=0;
  for(const m of (MEM[b]||[])){
    const c=(DATA.current&&DATA.current[m])||
      (DATA.network&&DATA.network.current&&DATA.network.current[m]);
    if(c&&c.state!=='calm'&&c.prob>best)best=c.prob;
    else if(c&&!best)best=Math.max(best,c.prob*.55);}
  return best||.55;}
function stateOf(m){
  return (DATA.current&&DATA.current[m])||
    (DATA.network&&DATA.network.current&&DATA.network.current[m])||null;}
function edgePath(e){
  const [x1,y1]=P[e.a],[x2,y2]=P[e.b];
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  const bend=26*(e.a<e.b?1:-1);
  return {x1,y1,x2,y2,cxp:mx-dy/L*bend,cyp:my+dx/L*bend};}
function qpoint(p,t){const a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;
  return [a*p.x1+b*p.cxp+c*p.x2,a*p.y1+b*p.cyp+c*p.y2];}
function rebuildPaths(){
  const f=FR[fi]; if(!f){livePaths=[];return;}
  livePaths=f.edges.filter(e=>P[e.src]&&P[e.dst])
    .map(e=>({a:e.src,b:e.dst,v:e.pct,p:edgePath({a:e.src,b:e.dst}),
      dots:Math.max(2,Math.round(e.pct/2.2)),
      speed:.0022+e.pct*.00012,phase:Math.random()}))
    .sort((x,y)=>y.v-x.v);}
const cv=document.getElementById('g'),cx=cv.getContext('2d');
function baseR(b,mi,live){
  return live? 11+13*blockConf(b) : 15;}
let t0=(typeof performance!=='undefined')?performance.now():0;
function draw(now){
  const t=((now||0)-t0)/1000;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,W,H);
  const f=FR[fi]||{members:{},edges:[]};
  const mi=monthIdx(f.end), live=(fi===LIVEI);
  for(const e of (livePaths||[])){
    const dim=sel&&e.a!==sel&&e.b!==sel;
    cx.globalAlpha=dim?.12:1;
    cx.strokeStyle='rgba(139,147,154,'+(0.10+e.v/140)+')';
    cx.lineWidth=.8+e.v/9;
    cx.beginPath();cx.moveTo(e.p.x1,e.p.y1);
    cx.quadraticCurveTo(e.p.cxp,e.p.cyp,e.p.x2,e.p.y2);cx.stroke();
    const col=FAMCOL[Math.max(0,blockFam(e.a,mi))];
    if(!REDUCED){
      for(let i=0;i<e.dots;i++){
        const u=((t*e.speed*60)+(i/e.dots)+e.phase)%1;
        const [x,y]=qpoint(e.p,u);
        cx.globalAlpha=dim?.05:.25+.6*Math.sin(Math.PI*u);
        cx.fillStyle=col;
        cx.beginPath();cx.arc(x,y,1.4+e.v/22,0,7);cx.fill();
        cx.globalAlpha=1;}}
    const [mx,my]=qpoint(e.p,.5);
    cx.font='10.5px JetBrains Mono,monospace';
    cx.fillStyle='rgba(139,147,154,'+(dim?.15:.8)+')';
    cx.textAlign='center';
    cx.fillText(e.v.toFixed(0)+'%',mx,my-6);}
  for(const b of Object.keys(P)){
    const [x,y]=P[b];
    const inFrame=!!f.members[b];
    const fam=inFrame?blockFam(b,mi):-1;
    const col=inFrame?FAMCOL[Math.max(0,fam)]:getCss('--faint');
    const base=inFrame?baseR(b,mi,live):13;
    const pulse=REDUCED?1:1+.10*Math.sin(t*2.1+x*.05);
    if(inFrame){
      const g=cx.createRadialGradient(x,y,base*.3,x,y,base*2.5*pulse);
      g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
      cx.fillStyle=g;
      cx.beginPath();cx.arc(x,y,base*2.5*pulse,0,7);cx.fill();}
    cx.strokeStyle=col;cx.lineWidth=(sel===b?2.6:1.4);
    if(!inFrame)cx.setLineDash([4,5]);
    cx.beginPath();cx.arc(x,y,base*pulse,0,7);cx.stroke();
    cx.setLineDash([]);
    if(inFrame){cx.fillStyle=col;
      cx.beginPath();cx.arc(x,y,base*.42,0,7);cx.fill();}
    const young=(MEM[b]||[]).some(m=>JOINED[m]&&JOINED[m]!=='founding');
    if(inFrame&&young){cx.strokeStyle=col;cx.globalAlpha=.3;
      cx.lineWidth=1;cx.beginPath();cx.arc(x,y,base*pulse+6,0,7);
      cx.stroke();cx.globalAlpha=1;}
    const side=LBL[b];
    const word=inFrame?(fam>0?FAMWORD[fam]:'calm'):'awaiting data';
    const info=live?(f.end):(f.end);
    let lx=x,ly=y,al='left';
    if(side==='left'){lx=x-base*2.6-8;al='right';}
    if(side==='right'){lx=x+base*2.6+8;}
    if(side==='top'){ly=y-base*2.7-16;al='center';}
    if(side==='bottom'){ly=y+base*2.7+22;al='center';}
    cx.textAlign=al;
    cx.font='600 12px Inter,sans-serif';cx.fillStyle='#E8EAED';
    cx.fillText(NAME[b],lx,ly-6);
    cx.font='600 11.5px Inter,sans-serif';cx.fillStyle=col;
    cx.fillText(word,lx,ly+8);}
  if(!REDUCED)requestAnimationFrame(draw);}
const card=document.getElementById('card');
function hideCard(){sel=null;card.classList.remove('on');}
function showCard(b){
  sel=b;
  const f=FR[fi]||{members:{}},mi=monthIdx(f.end),live=(fi===LIVEI);
  const inFrame=f.members[b]||[];
  let h='<span class=x>&times;</span><h3>'+NAME[b]+
    ' <span style="color:var(--faint);font-weight:400">'+f.end+
    (live?' &middot; live':'')+'</span></h3>';
  for(const m of (MEM[b]||[])){
    const fam=nodeFam(m,mi),known=fam>=0;
    const col=known?FAMCOL[fam]:getCss('--faint');
    const st=live?stateOf(m):null;
    let line='<div class=row><i style="background:'+col+
      ';color:'+col+'"></i><span>'+m+'</span>';
    if(live&&st)line+='<span style="color:'+col+'">'+
      (st.word||st.state).replace('_',' ')+'</span>'+
      '<span class=sh>'+Math.round(st.prob*100)+'%</span>';
    else if(known)line+='<span style="color:'+col+'">'+
      FAMWORD[fam]+'</span>';
    else line+='<span class=sh>no data yet</span>';
    if(JOINED[m]&&JOINED[m]!=='founding')
      line+='<span class=tag>joined '+JOINED[m]+'</span>';
    h+=line+'</div>';}
  const T=(V3.tree&&V3.tree.structure)||{};
  const tk=b==='energy'?'energy':(b==='fx'?'currencies':null);
  if(tk&&T[tk]){
    const hv=V3.tree.heat&&V3.tree.heat[tk]?V3.tree.heat[tk][mi]:null;
    h+='<div class=k>composition'+
      (hv!==null&&hv!==undefined?' &middot; heat '+
       Number(hv).toFixed(2)+' of 4':'')+'</div>';
    for(const cn in T[tk].children){
      const c=T[tk].children[cn],lf=c.leaf;
      const fam=lf?nodeFam(lf,mi):-1,known=fam>=0;
      const col=known?FAMCOL[fam]:getCss('--faint');
      h+='<div class=row><i style="background:'+col+';color:'+col+
        '"></i><span>'+cn+'</span><span class=sh>'+
        Math.round(c.share*100)+'%</span>'+
        (lf?(known?'<span style="color:'+col+'">'+FAMWORD[fam]+
         '</span>':'<span class=sh>awaiting</span>')
         :'<span class=sh>share only</span>')+'</div>';}
    if(tk==='currencies')
      h+='<div class=mut>the dollar is the numeraire; every major '+
        'is priced against it</div>';}
  if(inFrame.length&&inFrame.length<(MEM[b]||[]).length)
    h+='<div class=mut>this window computed from: '+
      inFrame.join(', ')+'</div>';
  if(!f.members[b])h+='<div class=mut>no data in this window</div>';
  card.innerHTML=h;
  const px=P[b][0]/W*100,py=P[b][1]/H*100;
  card.style.left=(P[b][0]>W/2?'auto':'calc('+px+'% + 34px)');
  card.style.right=(P[b][0]>W/2?'calc('+(100-px)+'% + 34px)':'auto');
  card.style.top='min(calc('+py+'% - 30px), calc(100% - 250px))';
  card.classList.add('on');
  card.querySelector('.x').onclick=ev=>{ev.stopPropagation();hideCard();};}
cv.addEventListener('click',ev=>{
  const r=cv.getBoundingClientRect();
  const mx=(ev.clientX-r.left)*W/(r.width||W),
        my=(ev.clientY-r.top)*H/(r.height||H);
  let hit=null;
  for(const b of Object.keys(P)){const [x,y]=P[b];
    if(Math.hypot(mx-x,my-y)<34)hit=b;}
  if(hit)showCard(hit);else hideCard();});
function setFrame(i){
  fi=Math.max(0,Math.min(LIVEI,i));hideCard();rebuildPaths();
  const f=FR[fi];
  document.getElementById('scrubmo').innerHTML=
    (fi>=LIVEI?'<b>now</b> &middot; '+(f?f.end:''):
     '<b>'+(f?f.end:'')+'</b>');
  document.querySelectorAll('.pin').forEach(el=>{
    el.classList.toggle('on',String(el.dataset.f)===String(fi));});
  let ev='';
  for(const p of (V3.pins||[])){
    if(f&&Math.abs(monthIdx(p[0])-monthIdx(f.end))<=3&&p[1]!=='LIVE')
      ev=p[0]+' &middot; '+p[1];}
  document.getElementById('evt').innerHTML=(fi<LIVEI?ev:'');
  if(REDUCED)draw(0);}
function tempSeries(){
  const out=[];
  for(let k=0;k<M.length;k++){
    const vals=[];
    for(const n in FAM){const v=FAM[n][k];
      if(v!==null&&v!==undefined&&v>=0)vals.push(v);}
    out.push(vals.length?25*vals.reduce((a,b)=>a+b,0)/vals.length:null);}
  return out;}
function scaleBar(val,max,opts){
  opts=opts||{};
  const pos=Math.max(0,Math.min(100,100*val/max));
  let h='<div class="scale'+(opts.flat?' flat':'')+'">';
  for(const t of (opts.ticks||[]))
    h+='<div class=tick style="left:'+
      Math.max(0,Math.min(100,100*t.v/max))+'%" title="'+t.l+'"></div>';
  h+='<div class=mk style="left:'+pos+'%"></div></div>';
  if(opts.zones)h+='<div class=zl>'+opts.zones.map(z=>'<span>'+z+
    '</span>').join('')+'</div>';
  if(opts.tickcap)h+='<div class=tickcap>'+opts.tickcap+'</div>';
  return h;}
function median(a){const s=a.filter(x=>x!==null).slice().sort((x,y)=>x-y);
  return s.length?s[Math.floor(s.length/2)]:null;}
function renderToday(){
  const Wd=DATA.weather;
  if(Wd){
    const h=document.getElementById('hero');
    const SC={risk_on_calm:'--up',financial_stress:'--down',
      demand_collapse:'--down',inflation_shock:'--hot',
      commodity_shock:'--fear',post_shock_glut:'--glut'};
    const cw=(DATA.synoptic&&DATA.synoptic.gate==='open')?
      DATA.synoptic.current.word:'';
    const cc=(DATA.synoptic&&DATA.synoptic.gate==='open')?
      getCss(SC[DATA.synoptic.current.state]||'--calm'):getCss('--calm');
    h.innerHTML=(cw?'<div class=cond style="color:'+cc+'">'+cw+
      '</div>':'')+
      '<div class=temp>'+Wd.temp+'<small> heat</small></div>'+
      (Wd.next_low!==undefined?'<div class=hl>next month '+
       '<b>'+Wd.next_low+'</b> to <b>'+Wd.next_high+'</b><br><span style="color:var(--faint)">world heat '+
       'index, 0 calm to 100 hot; range is forecast, assumes '+
       'independent instrument paths</span></div>':'');
    const ts=tempSeries();
    const med=median(ts);
    h.innerHTML+='<div style="flex-basis:100%">'+
      scaleBar(Wd.temp,100,{ticks:med!==null?[{v:med,l:'typical'}]:[],
        zones:['calm','unsettled','strained','storm'],
        tickcap:med!==null?'tick: typical, the median of the full '+
          'record, '+Math.round(med):''})+
      '<div class=spark>'+ts.slice(-12).map(function(v){
        const vv=v===null?0:v;
        const col=vv<15?getCss('--calm'):vv<35?getCss('--glut')
          :vv<60?getCss('--warn'):getCss('--hot');
        return '<i style="height:'+Math.max(6,vv*0.22)+
          'px;background:'+col+'"></i>';}).join('')+'</div>'+
      '<div class=tickcap>last twelve months</div></div>';
    const dl=document.getElementById('dials');
    let dh='';
    for(const d of (Wd.dials||[])){
      const ar=d.dir>0?'<span class=ar style="color:var(--hot)">&#8599;</span>':
        (d.dir<0?'<span class=ar style="color:var(--down)">&#8600;</span>':'');
      let sc='';
      if(d.scale){
        sc=scaleBar(d.scale.v,d.scale.max,{ticks:d.scale.ticks||[],
          zones:d.scale.zones,flat:!!d.scale.flat,
          tickcap:d.scale.tickcap});}
      dh+='<div class=dial><div class=n>'+d.name+'</div>'+
        '<div class=v>'+d.value+ar+'</div>'+sc+
        '<div class=d>'+d.detail+'</div></div>';}
    dl.innerHTML=dh;
    const fs=document.getElementById('fcstrip');
    if(Wd.forecast&&Wd.forecast.length){
      fs.innerHTML=Wd.forecast.map(c=>{
        const col=FAMCOL[c.fam>=0?c.fam:0];
        const lo=(c.lo!==undefined?c.lo:Math.max(0,c.temp-6)),
              hi=(c.hi!==undefined?c.hi:Math.min(100,c.temp+6));
        return '<div class=fccard style="border-color:'+col+'44">'+
          '<div class=mo3>'+c.month+'</div>'+
          '<div class=w style="color:'+col+'">'+c.word+'</div>'+
          '<div class=t>'+lo+' to '+hi+'</div>'+
          '<div class=rbar><div class=rng style="left:'+lo+
          '%;width:'+Math.max(2,hi-lo)+'%;background:'+col+
          '99"></div><div class=mid style="left:'+c.temp+'%"></div>'+
          '</div>'+
          '<div class=r>storm chance '+c.storm+'%</div></div>';}).join('')+
        '<div class=fcnote style="flex-basis:100%">'+(Wd.note||'')+
        '</div>';
    } else {
      fs.innerHTML='<div class=fcnote>forecast appears with the '+
        'first monthly outlook issue</div>';}
  }
  const liveF=FR[LIVEI]||{members:{}};
  const mi=monthIdx(liveF.end);
  const al=document.getElementById('alerts');
  let ah='';
  if(DATA.watch&&DATA.watch.on)ah+='<div class=lamp2><i style="background:var(--warn);color:var(--warn)"></i>storm watch on</div>';
  if(DATA.bust&&DATA.bust.on)ah+='<div class=lamp2><i style="background:var(--warn);color:var(--warn)"></i>outside this outlook&#39;s expected range</div>';
  al.innerHTML=ah; al.style.display=ah?'flex':'none';
  if(DATA.changed_line){const c=document.getElementById('changed');
    c.textContent=DATA.changed_line;}
  const tl=document.getElementById('tiles');
  let th='';
  for(const b of Object.keys(P)){
    const inF=!!liveF.members[b];
    const fam=inF?blockFam(b,mi):-1;
    const col=inF?FAMCOL[Math.max(0,fam)]:getCss('--faint');
    const word=inF?(fam>0?FAMWORD[fam]:'calm'):'awaiting';
    const conf=inF?Math.round(blockConf(b)*100):null;
    th+='<div class=tile data-b="'+b+'" style="cursor:pointer;'+
      'border-color:'+col+'44">'+
      '<div class=n>'+NAME[b]+'</div>'+
      '<div class=s style="color:'+col+'">'+word+'</div>'+
      '<div class=p>'+(conf!==null?conf+'% conf':'no data')+'</div></div>';}
  tl.innerHTML=th;
  const strip=document.getElementById('istrip');
  let ih='';
  const order=[].concat(...Object.keys(P).map(b=>MEM[b]||[]));
  for(const m of order){
    const st=stateOf(m);
    const fam=nodeFam(m,mi);
    const col=(fam>=0)?FAMCOL[fam]:getCss('--faint');
    ih+='<div class=itile style="border-color:'+col+'33">'+
      '<div class=n>'+m.replace('_',' ')+'</div>'+
      (st?'<div class=s style="color:'+col+'">'+
        (st.word||st.state).replace('_',' ')+'</div>'+
        '<div class=p>'+Math.round(st.prob*100)+'%</div>'+'<div class=cbar><i style="width:'+Math.round(st.prob*100)+'%;background:'+col+'"></i></div>'
        :'<div class=s style="color:var(--faint)">awaiting</div>'+
         '<div class=p>&nbsp;</div>')+'</div>';}
  strip.innerHTML=ih;
}
function setTab(t){
  document.getElementById('pane-today').style.display=
    (t==='today'?'block':'none');
  document.getElementById('pane-map').style.display=
    (t==='map'?'block':'none');
  document.getElementById('tab-today').classList.toggle('on',t==='today');
  document.getElementById('tab-map').classList.toggle('on',t==='map');
  if(t==='map'&&!REDUCED)requestAnimationFrame(draw);}
function init(){
  const syn=document.getElementById('syn');
  if(DATA.synoptic&&DATA.synoptic.gate==='open'){
    const SC={risk_on_calm:'--up',financial_stress:'--down',
      demand_collapse:'--down',inflation_shock:'--hot',
      commodity_shock:'--fear',post_shock_glut:'--glut'};
    syn.innerHTML='Weather system: <b style="color:'+
      getCss(SC[DATA.synoptic.current.state]||'--calm')+'">'+
      DATA.synoptic.current.word+'</b>.';}
  document.getElementById('subsyn').textContent=
    'blocks at rest; tap one for its instruments';
  document.getElementById('issued').textContent=
    'data to '+(M[M.length-1]||'')+' · issued '+(DATA.issued||'');
  if(DATA.streak&&DATA.streak.row){
    const el=document.getElementById('streak');
    const CM={hit:getCss('--up'),miss:getCss('--hot')};
    el.innerHTML=DATA.streak.row.map(d=>'<i style="background:'+
      (CM[d.status]||getCss('--faint'))+'"></i>').join('')+
      '<span>'+(DATA.streak.totals_words||'')+'</span>'+
      '<span class=note>forward record begins with bulletin 002</span>';
    el.style.display='flex';}
  if(DATA.daily_obs&&DATA.daily_obs.series){
    document.getElementById('ticker').innerHTML=
      '<span style="color:var(--faint)">observations</span>'+
      DATA.daily_obs.series.map(s=>'<span>'+s.name+' <b>'+s.value+
      '</b> '+(s.delta||'')+'</span>').join('');}
  if(DATA.health){
    document.getElementById('lights').innerHTML='feeds'+
      DATA.health.map(h=>'<i title="'+h.feed+'" style="background:'+
      (h.ok?getCss('--up'):getCss('--hot'))+'"></i>').join('');}
  const pr=document.getElementById('pins');
  let ph='';
  for(const p of (V3.pins||[])){
    let best=0,bd=1e9;
    for(let k=0;k<FR.length;k++){
      const d=Math.abs(monthIdx(FR[k].end)-monthIdx(p[0]));
      if(d<bd){bd=d;best=k;}}
    ph+='<button class=pin data-f="'+best+'">'+p[1]+'</button>';}
  pr.innerHTML=ph;
  document.querySelectorAll('.pin').forEach(el=>{
    el.addEventListener('click',()=>{
      setFrame(parseInt(el.dataset.f)||0);});});
  const sc=document.getElementById('scrub');
  sc.max=String(Math.max(1,LIVEI));sc.value=String(fi);
  sc.addEventListener('input',ev=>{
    let v=parseInt(ev.target.value);if(!(v>=0))v=0;
    setFrame(v);});
  setFrame(LIVEI);
  renderToday();
  document.getElementById('tab-today').addEventListener('click',
    ()=>setTab('today'));
  document.getElementById('tab-map').addEventListener('click',
    ()=>setTab('map'));
  setTab('today');
  if(!REDUCED)requestAnimationFrame(draw);}
init();
</script>
</body></html>
